<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKZ Datatool — GO! Inspira</title>
<style>
  :root {
    --mint: #d6eee0;
    --mint-mid: #85c598;
    --mint-dark: #2e8b57;
    --black: #1a1a1a;
    --gray-700: #444;
    --gray-500: #777;
    --gray-300: #ccc;
    --gray-100: #f5f5f5;
    --white: #fff;
    --border: 1px solid #dde6e1;
    --radius: 8px;
    --shadow: 0 1px 4px rgba(0,0,0,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f7f2; color: var(--black); min-height: 100vh; font-size: 14px; }

  /* ── AUTH ── */
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #e8f5ec 0%, #d6eee0 100%); }
  .auth-card { background: white; border-radius: 14px; padding: 40px 44px; width: 400px; box-shadow: 0 4px 32px rgba(0,0,0,0.10); }
  .auth-logo { margin-bottom: 28px; text-align: center; }
  .auth-logo img { height: 52px; }
  .auth-subtitle { font-size: 13px; color: var(--gray-500); text-align: center; margin-bottom: 26px; }
  .auth-label { font-size: 12px; font-weight: 600; color: var(--gray-700); margin-bottom: 5px; display: block; }
  .auth-input { width: 100%; padding: 9px 12px; border: var(--border); border-radius: 7px; font-size: 14px; outline: none; transition: border-color .15s; margin-bottom: 14px; }
  .auth-input:focus { border-color: var(--mint-mid); }
  .auth-btn { width: 100%; padding: 11px; background: var(--black); color: white; border: none; border-radius: 7px; font-size: 14px; font-weight: 600; cursor: pointer; letter-spacing: .01em; transition: opacity .15s; margin-top: 4px; }
  .auth-btn:hover { opacity: .85; }
  .auth-error { background: #fdeaea; color: #8b2020; border-radius: 6px; padding: 8px 12px; font-size: 12px; margin-bottom: 12px; }
  .pw-note { font-size: 11px; color: var(--gray-500); margin-top: 10px; text-align: center; }
  .pw-change-banner { background: #fff8dc; border: 1px solid #e6cc66; border-radius: 7px; padding: 10px 14px; font-size: 12px; margin-bottom: 16px; color: #7a5e00; }

  /* ── LAYOUT ── */
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 230px; background: var(--black); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-logo { padding: 18px 16px 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .sidebar-logo img { height: 32px; filter: brightness(0) invert(1); opacity: .85; }
  .sidebar-subtitle { font-size: 10px; color: rgba(255,255,255,.35); margin-top: 5px; letter-spacing: .04em; }
  .sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
  .nav-group { font-size: 10px; font-weight: 700; color: rgba(255,255,255,.28); letter-spacing: .09em; padding: 12px 10px 5px; }
  .nav-item { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: rgba(255,255,255,.6); cursor: pointer; transition: all .12s; margin-bottom: 1px; }
  .nav-item:hover { background: rgba(255,255,255,.07); color: white; }
  .nav-item.active { background: var(--mint-dark); color: white; }
  .nav-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-done { background: var(--mint-mid); }
  .dot-bezig { background: #f0c040; }
  .dot-todo { background: rgba(255,255,255,.2); }
  .sidebar-footer { padding: 12px 8px; border-top: 1px solid rgba(255,255,255,.08); }
  .sidebar-user { display: flex; align-items: center; gap: 9px; padding: 8px 10px; }
  .sidebar-avatar { width: 30px; height: 30px; background: var(--mint-dark); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: white; flex-shrink: 0; }
  .sidebar-user-name { font-size: 12px; color: white; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-user-role { font-size: 10px; color: rgba(255,255,255,.38); }
  .logout-btn { background: none; border: none; color: rgba(255,255,255,.35); cursor: pointer; padding: 4px; border-radius: 4px; }
  .logout-btn:hover { color: white; }

  /* ── MAIN ── */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { background: white; border-bottom: var(--border); padding: 0 24px; height: 52px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .topbar-title { font-size: 16px; font-weight: 700; color: var(--black); }
  .school-pill { background: var(--mint); color: var(--mint-dark); border: none; border-radius: 99px; padding: 5px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .school-selector-wrap { display: flex; align-items: center; gap: 8px; }
  .school-selector-label { font-size: 12px; color: var(--gray-500); }
  .school-selector { border: var(--border); border-radius: 6px; padding: 5px 10px; font-size: 13px; background: white; color: var(--black); cursor: pointer; }
  .content { flex: 1; padding: 24px; overflow-y: auto; }

  /* ── DASHBOARD ── */
  .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 22px; }
  .stat-card { background: white; border: var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .stat-val { font-size: 30px; font-weight: 700; color: var(--black); line-height: 1; }
  .stat-lbl { font-size: 12px; color: var(--gray-500); margin-top: 5px; }
  .section-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .section-title-row h2 { font-size: 15px; font-weight: 700; color: var(--black); }
  .month-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; }
  .month-card { background: white; border: var(--border); border-radius: var(--radius); padding: 14px; cursor: pointer; transition: all .12s; position: relative; overflow: hidden; }
  .month-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background: var(--gray-300); }
  .month-card.done::before { background: var(--mint-mid); }
  .month-card.bezig::before { background: #f0c040; }
  .month-card:hover { border-color: var(--mint-mid); box-shadow: var(--shadow); }
  .month-name { font-size: 14px; font-weight: 700; color: var(--black); margin-bottom: 4px; }
  .month-themes { font-size: 11px; color: var(--gray-500); margin-bottom: 9px; line-height: 1.4; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 99px; }
  .badge-done { background: var(--mint); color: var(--mint-dark); }
  .badge-bezig { background: #fff3c4; color: #7a5e00; }
  .badge-todo { background: var(--gray-100); color: var(--gray-500); border: 1px solid var(--gray-300); }
  .prog-bar { height: 3px; background: var(--gray-100); border-radius: 99px; margin-top: 9px; overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 99px; background: var(--mint-mid); }

  /* ── FORM ── */
  .form-topbar { background: white; border: var(--border); border-radius: var(--radius); padding: 12px 18px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .form-topbar-left { display: flex; align-items: center; gap: 12px; }
  .form-topbar-right { display: flex; align-items: center; gap: 10px; }
  .btn { padding: 7px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: var(--border); background: white; color: var(--black); display: inline-flex; align-items: center; gap: 6px; transition: all .12s; }
  .btn:hover { background: var(--gray-100); }
  .btn-primary { background: var(--black); color: white; border-color: var(--black); }
  .btn-primary:hover { opacity: .85; }
  .btn-success { background: var(--mint-dark); color: white; border-color: var(--mint-dark); }
  .btn-success:hover { opacity: .85; }
  .label-sm { font-size: 12px; color: var(--gray-500); }
  .select-sm { border: var(--border); border-radius: 6px; padding: 5px 9px; font-size: 13px; background: white; color: var(--black); }

  .form-header { background: var(--mint); border-radius: var(--radius); padding: 14px 20px; margin-bottom: 14px; }
  .form-month-name { font-size: 20px; font-weight: 700; color: var(--black); margin-bottom: 4px; }
  .rok-text { font-size: 12px; color: var(--mint-dark); line-height: 1.5; }

  .section-block { background: white; border: var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .section-hdr { padding: 11px 18px; background: var(--gray-100); border-bottom: var(--border); display: flex; align-items: center; justify-content: space-between; }
  .section-hdr-title { font-size: 14px; font-weight: 700; color: var(--black); }
  .year-cols-hdr { display: grid; padding: 7px 18px; border-bottom: var(--border); background: #fafbfa; }
  .year-col-lbl { font-size: 11px; font-weight: 700; color: var(--gray-700); text-align: center; }
  .year-col-lbl.current { color: var(--mint-dark); }
  .ind-row { display: grid; border-bottom: 1px solid #f0f4f1; align-items: start; gap: 10px; padding: 9px 18px; }
  .ind-row:last-of-type { border-bottom: none; }
  .ind-label { font-size: 13px; color: var(--gray-700); line-height: 1.4; padding-top: 6px; }
  .cell-input { width: 100%; padding: 6px 8px; border: var(--border); border-radius: 5px; font-size: 13px; outline: none; text-align: center; background: white; }
  .cell-input:focus { border-color: var(--mint-mid); }
  .cell-readonly { width: 100%; padding: 6px 8px; font-size: 13px; text-align: center; color: var(--gray-500); background: var(--gray-100); border-radius: 5px; border: 1px solid transparent; }
  .cell-select { width: 100%; padding: 6px 7px; border: var(--border); border-radius: 5px; font-size: 12px; background: white; color: var(--black); }
  .cell-select:focus { border-color: var(--mint-mid); }
  .cell-textarea { width: 100%; padding: 6px 8px; border: var(--border); border-radius: 5px; font-size: 13px; resize: vertical; min-height: 56px; font-family: inherit; background: white; }
  .cell-textarea:focus { border-color: var(--mint-mid); }

  /* Jaar-indicator per rij */
  .year-tag { font-size: 10px; padding: 1px 7px; border-radius: 99px; display: inline-block; margin-bottom: 3px; }
  .year-tag.current { background: var(--mint); color: var(--mint-dark); font-weight: 600; }
  .year-tag.prev { background: var(--gray-100); color: var(--gray-500); }

  /* Bijlagen */
  .attach-block { border-top: var(--border); padding: 10px 18px; background: #fafbfa; display: flex; flex-direction: column; gap: 8px; }
  .attach-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .attach-lbl { font-size: 11px; font-weight: 600; color: var(--gray-500); width: 55px; flex-shrink: 0; }
  .attach-input { flex: 1; min-width: 160px; padding: 5px 9px; border: var(--border); border-radius: 5px; font-size: 12px; background: white; }
  .attach-input:focus { border-color: var(--mint-mid); outline: none; }
  .attach-add { font-size: 11px; color: var(--mint-dark); cursor: pointer; background: none; border: none; padding: 2px 6px; border-radius: 4px; }
  .attach-add:hover { background: var(--mint); }

  /* ── SCHOOLS TABLE ── */
  .schools-card { background: white; border: var(--border); border-radius: var(--radius); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th { padding: 10px 14px; font-size: 11px; font-weight: 700; color: var(--gray-500); background: var(--gray-100); border-bottom: var(--border); text-align: left; }
  tbody td { padding: 11px 14px; border-bottom: var(--border); font-size: 13px; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #f5fbf6; cursor: pointer; }
  .prog-mini-wrap { display: flex; align-items: center; gap: 8px; }
  .prog-mini-bar { flex: 1; height: 4px; background: var(--gray-100); border-radius: 99px; }
  .prog-mini-fill { height: 100%; background: var(--mint-mid); border-radius: 99px; }

  /* ── WACHTWOORD WIJZIGEN ── */
  .pw-form { background: white; border: var(--border); border-radius: var(--radius); padding: 28px 32px; max-width: 420px; margin: 40px auto; }
  .pw-form h2 { font-size: 17px; font-weight: 700; margin-bottom: 18px; }

  /* ── TOAST ── */
  .toast { position: fixed; bottom: 22px; right: 22px; background: var(--mint-dark); color: white; padding: 10px 18px; border-radius: var(--radius); font-size: 13px; font-weight: 500; z-index: 999; box-shadow: 0 4px 20px rgba(0,0,0,.15); animation: slideUp .2s ease; }
  .toast.error { background: #8b2020; }
  @keyframes slideUp { from { transform: translateY(8px); opacity:0; } to { transform: translateY(0); opacity:1; } }

  .loading { display:flex; align-items:center; justify-content:center; padding: 60px; color: var(--gray-500); }
  h2 { font-size: 15px; font-weight: 700; margin-bottom: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ── CONFIG ──────────────────────────────────────────────────
const AIRTABLE_BASE = 'appNiHSDVrEsCW3yw';
const AIRTABLE_API_KEY = 'pat4MTIYFPEVOUDRp.ccd2cca55409f3472d94240feb11a49ab58e5b8060bdc02d51808905c7405e35';

// ── AIRTABLE API ─────────────────────────────────────────────
async function atGet(table, params='') {
  const url = `https://api.airtable.com/v0/${AIRTABLE_BASE}/${encodeURIComponent(table)}${params}`;
  const res = await fetch(url, { headers: { Authorization: `Bearer ${AIRTABLE_API_KEY}` } });
  if (!res.ok) throw new Error(`Airtable ${res.status}: ${await res.text()}`);
  return res.json();
}
async function atPost(table, fields) {
  const url = `https://api.airtable.com/v0/${AIRTABLE_BASE}/${encodeURIComponent(table)}`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { Authorization: `Bearer ${AIRTABLE_API_KEY}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields })
  });
  if (!res.ok) throw new Error(`Airtable ${res.status}: ${await res.text()}`);
  return res.json();
}
async function atPatch(table, recordId, fields) {
  const url = `https://api.airtable.com/v0/${AIRTABLE_BASE}/${encodeURIComponent(table)}/${recordId}`;
  const res = await fetch(url, {
    method: 'PATCH',
    headers: { Authorization: `Bearer ${AIRTABLE_API_KEY}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields })
  });
  const json = await res.json();
  if (!res.ok) {
    console.error('Airtable PATCH error:', JSON.stringify(json));
    throw new Error(`Airtable ${res.status}: ${JSON.stringify(json)}`);
  }
  return json;
}

// Login via Airtable Scholen-tabel
async function loginFromAirtable(email, password) {
  try {
    const filter = '?filterByFormula=' + encodeURIComponent(`AND({DirecteurEmail}="${email}",{Wachtwoord_Hash}="${password}")`);
    const data = await atGet('Gebruikers', filter);
    if (data.records && data.records.length > 0) {
      const rec = data.records[0];
      const f = rec.fields;

      // Haal gekoppelde scholen op
      const schoolIds = f.Scholen || [];
      let scholen = [];
      for (const schoolId of schoolIds) {
        try {
          const schoolRes = await fetch(
            `https://api.airtable.com/v0/${AIRTABLE_BASE}/Scholen/${schoolId}`,
            { headers: { Authorization: `Bearer ${AIRTABLE_API_KEY}` } }
          );
          const schoolData = await schoolRes.json();
          scholen.push({
            id: schoolId,
            name: schoolData.fields?.Name || schoolData.fields?.SchoolNaam || schoolId,
            code: schoolData.fields?.SchoolCode || schoolId,
          });
        } catch(e) {
          console.warn('Could not load school:', schoolId, e.message);
        }
      }

      return {
        id: rec.id,
        email: f.DirecteurEmail,
        password: password,
        name: f.Name || f.Naam || email,
        role: f.Rol || 'School',
        scholen: scholen,
        mustChangePw: !f.Wachtwoord_Gewijzigd,
        recordId: rec.id,
      };
    }
    return null;
  } catch(e) {
    console.warn('Airtable login failed, using demo:', e.message);
    return null;
  }
}

// Laad alle scholen uit Airtable
async function loadSchools() {
  try {
    const data = await atGet('Scholen', '?filterByFormula={Actief}=1');
    if (data.records && data.records.length > 0) {
      S.airtableSchools = data.records.map(r => ({
        id: r.id,
        name: r.fields.Name || r.fields.SchoolNaam,
        code: r.fields.SchoolCode,
        lastLogin: '—',
      }));
    }
  } catch(e) {
    console.warn('Could not load schools from Airtable:', e.message);
  }
}

// Laad data voor een maand uit Airtable
async function loadMonthData(monthId, schoolCode) {
  try {
    const tableName = monthId.charAt(0).toUpperCase() + monthId.slice(1);
    const schoolId = S.selectedSchool?.id;
    // Haal alle records op - filter client-side want Airtable FIND werkt niet op linked records
    const data = await atGet(tableName, '');
    // Filter client-side op school ID (betrouwbaarder dan Airtable filter op linked records)
    const schoolRecords = (data.records || []).filter(rec => {
      const schoolField = rec.fields?.School;
      return Array.isArray(schoolField) && schoolField.includes(schoolId);
    });
    console.log('Found', schoolRecords.length, 'records for school', schoolId, 'in', tableName);
    if (schoolRecords.length > 0) {
      schoolRecords.forEach(rec => {
        const fields = rec.fields;
        // Bepaal schooljaar van dit record
        const recordJaar = Array.isArray(fields['Schooljaar']) && fields['Schooljaar'].length > 0
          ? (fields['Schooljaar'][0]?.name || CURRENT_SCHOOLJAAR)
          : CURRENT_SCHOOLJAAR;

        Object.entries(fields).forEach(([k, v]) => {
          if (k !== 'School' && k !== 'Schooljaar' && k !== 'Status' && k !== 'SchoolCode (from School)' && k !== 'Bijlage' && k !== 'Name') {
            S.formData[k + '_' + recordJaar] = v;
            console.log('Loading field:', k + '_' + recordJaar, '=', v);
          }
        });

        // Het huidig schooljaar bepaalt de status en het bewerkbare record
        if (recordJaar === CURRENT_SCHOOLJAAR) {
          S.formStatus = fields.Status || 'Te doen';
          S.currentRecordId = rec.id;
          setStatus(schoolCode, monthId, fields.Status || 'Te doen');
        }
      });
      console.log('Loaded', schoolRecords.length, 'records for', monthId);
    } else {
      S.currentRecordId = null;
      S.formStatus = getStatus(schoolCode, monthId) || 'Te doen';
      console.log('No record found for', monthId, schoolCode);
    }
  } catch(e) {
    console.warn('Could not load month data:', e.message);
  }
}

// Update Laatste_Login
async function updateLastLogin(recordId) {
  try {
    await atPatch('Gebruikers', recordId, {
      Laatste_Login: new Date().toISOString()
    });
  } catch(e) {
    console.warn('Could not update last login:', e.message);
  }
}

// Schooljaren — worden dynamisch geladen uit Airtable via Huidig-vinkje
let CURRENT_SCHOOLJAAR = '2026-2027'; // fallback, wordt overschreven bij login
let PREV_SCHOOLJAAR    = '2025-2026';
let PREV2_SCHOOLJAAR   = '2024-2025';

function updateSchooljarenFromCurrent(huidig) {
  // Bereken vorige jaren op basis van huidig schooljaar
  const startYear = parseInt(huidig.split('-')[0]);
  CURRENT_SCHOOLJAAR = huidig;
  PREV_SCHOOLJAAR    = `${startYear-1}-${startYear}`;
  PREV2_SCHOOLJAAR   = `${startYear-2}-${startYear-1}`;
  console.log('Schooljaren:', CURRENT_SCHOOLJAAR, PREV_SCHOOLJAAR, PREV2_SCHOOLJAAR);

function set(u) { Object.assign(S,u); render(); }
function toast(msg, type='ok') {
  set({toast:{msg,type}});
  setTimeout(()=>set({toast:null}),3000);
}

// ── RENDER ──────────────────────────────────────────────────
function render() {
  const r = document.getElementById('root');
  if (S.view==='login') { r.innerHTML=renderLogin(); bindLogin(); return; }
  r.innerHTML = `<div class="app">${renderSidebar()}<div class="main">${renderTopbar()}<div class="content">${renderContent()}</div></div></div>${S.toast?`<div class="toast${S.toast.type==='error'?' error':''}">${S.toast.msg}</div>`:''}`;

}

// ── LOGIN ────────────────────────────────────────────────────
function renderLogin() {
  return `<div class="auth-wrap"><div class="auth-card">
    <div class="auth-logo"><img src="${LOGO_SRC}" alt="GO! Inspira"></div>
    <p class="auth-subtitle">IKZ Datatool — Interne KwaliteitsZorg</p>
    <div id="a-err"></div>
    <label class="auth-label">E-mailadres</label>
    <input class="auth-input" id="a-email" type="email" placeholder="directeur@school.be" autocomplete="email">
    <label class="auth-label">Wachtwoord</label>
    <input class="auth-input" id="a-pw" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="auth-btn" id="a-btn">Aanmelden</button>
    <p class="pw-note">Gebruik je persoonlijk Inspira-scholenadres om aan te melden.</p>
  </div></div>
  <div id="forgot-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center"></div>`;
}
function bindLogin() {
  const go = async () => {
    const email = document.getElementById('a-email').value.trim();
    const pw = document.getElementById('a-pw').value;
    const btn = document.getElementById('a-btn');
    btn.textContent = 'Aanmelden…'; btn.disabled = true;

    // 1. Probeer Airtable
    let u = await loginFromAirtable(email, pw);

    // 2. Fallback op demo-gebruikers
    if (!u) u = DEMO_USERS.find(x => x.email===email && x.password===pw);

    btn.textContent = 'Aanmelden'; btn.disabled = false;

    if (!u) {
      const errEl = document.getElementById('a-err');
      if (errEl) errEl.innerHTML=`<div class="auth-error">Ongeldig e-mailadres of wachtwoord.</div>`;
      return;
    }

    // Update laatste login in Airtable
    if (u.recordId) updateLastLogin(u.recordId);

    // Laad huidig schooljaar record ID en naam
    try {
      const sjData = await atGet('Schooljaren', '?filterByFormula=' + encodeURIComponent('{Huidig}=1'));
      if (sjData.records?.length > 0) {
        S.schooljaarRecordId = sjData.records[0].id;
        const huidigNaam = sjData.records[0].fields?.Name || sjData.records[0].fields?.Jaar || CURRENT_SCHOOLJAAR;
        updateSchooljarenFromCurrent(huidigNaam);
      }
    } catch(e) {
      console.warn('Could not load schooljaar:', e.message);
    }

    // Bepaal beschikbare scholen voor deze gebruiker
    let scholen = [];
    if (u.role === 'coordinator' || u.role === 'Coördinator') {
      // Coördinator ziet alle scholen
      await loadSchools();
      scholen = S.airtableSchools?.length ? S.airtableSchools : DEMO_SCHOOLS;
    } else if (u.scholen && u.scholen.length > 0) {
      // Gebruiker ziet alleen gekoppelde scholen
      scholen = u.scholen;
    } else {
      scholen = DEMO_SCHOOLS;
    }

    S.userScholen = scholen;
    const school = scholen[0];
    set({user:u, selectedSchool:school, view:'dashboard', changingPw:u.mustChangePw});
  };
  document.getElementById('a-btn').addEventListener('click',go);
  document.getElementById('a-pw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
}

// ── BIND ─────────────────────────────────────────────────────
function bindApp() {
  document.getElementById('logout-btn')?.addEventListener('click',()=>set({view:'login',user:null,selectedSchool:null}));
  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>set({view:el.dataset.nav})));
  document.querySelectorAll('[data-month]').forEach(el=>el.addEventListener('click', async ()=>{
    const m=MONTHS.find(x=>x.id===el.dataset.month);
    const code=S.selectedSchool?.code;
    const s=getStatus(code,m.id);
    // Laad eerst data, dan render
    S.formData = {};
    S.currentRecordId = null;
    set({view:'month',selectedMonth:m,formStatus:s,loading:true});
    if (code) await loadMonthData(m.id, code);
    set({loading:false});
  }));
  document.getElementById('school-sel')?.addEventListener('change',e=>{
    const s=(S.userScholen||DEMO_SCHOOLS).find(x=>x.code===e.target.value);
    if(s) set({selectedSchool:s, formData:{}, currentRecordId:null});
  });
  document.getElementById('back-btn')?.addEventListener('click',()=>set({view:'dashboard'}));
  document.getElementById('back-btn-bottom')?.addEventListener('click',()=>set({view:'dashboard'}));
  document.getElementById('form-status-bottom')?.addEventListener('change',e=>{S.formStatus=e.target.value; document.getElementById('form-status').value=e.target.value;});
  document.getElementById('save-btn-bottom')?.addEventListener('click',()=>document.getElementById('save-btn')?.click());
  document.getElementById('form-status')?.addEventListener('change',e=>{S.formStatus=e.target.value;});

  // Jaar per indicator
  document.querySelectorAll('[data-jaar-key]').forEach(sel=>{
    sel.addEventListener('change',e=>{
      S.indicatorJaar[sel.dataset.jaarKey]=e.target.value;
      render();
    });
  });

  // Invulvelden opslaan in state (live)
  document.querySelectorAll('[data-key]').forEach(el=>{
    el.addEventListener('change',()=>{
      S.formData[el.dataset.key+'_'+el.dataset.year]=el.value;
    });
  });

  // Bijlagen
  document.querySelectorAll('[data-attach-link]').forEach(el=>{
    el.addEventListener('input',()=>{
      const key=el.dataset.attachLink; const i=parseInt(el.dataset.idx);
      if (!S.attachments[key]) S.attachments[key]=[{link:'',note:''}];
      S.attachments[key][i].link=el.value;
    });
  });
  document.querySelectorAll('[data-attach-note]').forEach(el=>{
    el.addEventListener('input',()=>{
      const key=el.dataset.attachNote; const i=parseInt(el.dataset.idx);
      if (!S.attachments[key]) S.attachments[key]=[{link:'',note:''}];
      S.attachments[key][i].note=el.value;
    });
  });
  document.querySelectorAll('[data-add-attach]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const key=btn.dataset.addAttach;
      if (!S.attachments[key]) S.attachments[key]=[{link:'',note:''}];
      S.attachments[key].push({link:'',note:''});
      render();
    });
  });

  // Save
  document.getElementById('save-btn')?.addEventListener('click', async ()=>{
    // Verzamel alle invulvelden
    document.querySelectorAll('[data-key]').forEach(el=>{
      S.formData[el.dataset.key+'_'+el.dataset.year]=el.value;
    });

    const code = S.selectedSchool?.code;
    const monthId = S.selectedMonth?.id;
    const tableName = monthId.charAt(0).toUpperCase() + monthId.slice(1);

    // Groepeer velden per schooljaar
    const perJaar = {};
    Object.entries(S.formData).forEach(([k, v]) => {
      if (v === '' || v === null || v === undefined) return;
      // Match _XXXX-XXXX suffix
      const match = k.match(/^(.+)_(\d{4}-\d{4})$/);
      if (match) {
        const field = match[1];
        const jaar = match[2];
        if (!perJaar[jaar]) perJaar[jaar] = {};
        perJaar[jaar][field] = v;
      }
    });

    // Voeg status toe aan huidig schooljaar
    if (!perJaar[CURRENT_SCHOOLJAAR]) perJaar[CURRENT_SCHOOLJAAR] = {};
    perJaar[CURRENT_SCHOOLJAAR]['Status'] = S.formStatus;

    try {
      // Sla per schooljaar op
      for (const [jaar, fields] of Object.entries(perJaar)) {
        // Zoek bestaand record voor dit schooljaar
        // Haal alle records op en filter client-side
        const allRecs = await atGet(tableName, '');
        const schoolId2 = S.selectedSchool?.id;
        const existing = { records: (allRecs.records || []).filter(rec => {
          const schoolField = rec.fields?.School;
          const jaarField = rec.fields?.Schooljaar;
          const schoolMatch = Array.isArray(schoolField) && schoolField.includes(schoolId2);
          const jaarMatch = Array.isArray(jaarField) && jaarField.some(j => 
            typeof j === 'string' ? j === S.schooljaarRecordId : j?.id === S.schooljaarRecordId
          );
          // Voor huidig jaar: match op schooljaar record ID
          // Voor vorige jaren: match op naam in Schooljaar lookup
          const jaarNaam = rec.fields?.['Schooljaar (from Schooljaar)'] || 
                           (Array.isArray(rec.fields?.Schooljaar) ? rec.fields.Schooljaar[0] : null);
          return schoolMatch && (jaarMatch || jaarNaam === jaar);
        })};

        // Voeg school en schooljaar links toe
        if (S.selectedSchool?.id) fields['School'] = [S.selectedSchool.id];

        // Zoek schooljaar record ID
        const sjData = await atGet('Schooljaren', '?filterByFormula=' + encodeURIComponent(`{Name}="${jaar}"`));
        if (sjData.records?.length > 0) {
          fields['Schooljaar'] = [sjData.records[0].id];
        }

        console.log('Saving year', jaar, ':', JSON.stringify(fields));

        if (existing.records && existing.records.length > 0) {
          // Neem het meest recent gewijzigde record
          const rec = existing.records.sort((a,b) =>
            new Date(b.fields?.modifiedTime||0) - new Date(a.fields?.modifiedTime||0)
          )[0];
          await atPatch(tableName, rec.id, fields);
          if (jaar === CURRENT_SCHOOLJAAR) S.currentRecordId = rec.id;
        } else {
          // Nieuw record aanmaken
          const result = await atPost(tableName, fields);
          if (jaar === CURRENT_SCHOOLJAAR) S.currentRecordId = result.id;
        }
      }

      setStatus(code, monthId, S.formStatus);
      toast('✓ Gegevens opgeslagen voor ' + S.selectedMonth?.name);
      render();
    } catch(e) {
      console.error('Save error:', e);
      toast('Fout bij opslaan: ' + e.message, 'error');
    }
  });

  // Schools
  document.querySelectorAll('.school-row').forEach(row=>{
    row.addEventListener('click',()=>{
      const s=DEMO_SCHOOLS.find(x=>x.code===row.dataset.school);
      set({selectedSchool:s,view:'dashboard'});
    });
  });

  // Wachtwoord
  document.getElementById('pw-save-btn')?.addEventListener('click', async ()=>{
    const np=document.getElementById('new-pw').value;
    const cp=document.getElementById('confirm-pw').value;
    if(np.length<8){document.getElementById('pw-err').innerHTML='<div class="auth-error">Wachtwoord moet minstens 8 tekens bevatten.</div>';return;}
    if(np!==cp){document.getElementById('pw-err').innerHTML='<div class="auth-error">Wachtwoorden komen niet overeen.</div>';return;}

    const btn = document.getElementById('pw-save-btn');
    btn.textContent = 'Opslaan…'; btn.disabled = true;

    try {
      if (S.user?.recordId) {
        await atPatch('Gebruikers', S.user.recordId, {
          Wachtwoord_Hash: np,
          Wachtwoord_Gewijzigd: true
        });
      }
      S.user.password = np;
      S.user.mustChangePw = false;
      toast('✓ Wachtwoord succesvol gewijzigd');
      set({changingPw:false});
    } catch(e) {
      document.getElementById('pw-err').innerHTML=`<div class="auth-error">Fout bij opslaan: ${e.message}</div>`;
      btn.textContent = 'Wachtwoord opslaan'; btn.disabled = false;
    }
  });
}

render();
</script>
</body>
</html>
